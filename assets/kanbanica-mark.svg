<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kanbanica">
  <!--
    A kanban board: a rounded rectangle (the board) with three horizontal bars
    (cards stacked in a column). Only two layers of geometry, the way the
    Docket mark is, so it reads at 26px in a card and at 72px on the hero.
    The green reads as "in progress"; the lighter bars are the cards.
  -->
  <rect x="7" y="8" width="50" height="48" rx="8" fill="#15803d"/>
  <rect x="14" y="44" width="32" height="5" rx="1.5" fill="#dcfce7"/>
  <rect x="14" y="35" width="32" height="5" rx="1.5" fill="#dcfce7"/>
  <rect x="14" y="26" width="32" height="5" rx="1.5" fill="#dcfce7"/>
</svg>
