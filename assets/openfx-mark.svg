<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenFX">
  <!--
    A terminal prompt: caret, then the cursor block that follows it. The mark
    has to read at 28px in a card and at 16px in a favicon, so it is two shapes
    and no detail — anything finer disappears at the size it is actually used.
    currentColor throughout, so it inherits the card's text colour and needs no
    second definition for the dark surface.
  -->
  <path d="M12 18 L28 32 L12 46" fill="none" stroke="currentColor" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="39" width="20" height="7" rx="3.5" fill="currentColor"/>
</svg>
